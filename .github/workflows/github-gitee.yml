name: 创建订阅文件-同步gitee版

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: '输出文件格式（compact=紧凑单行 / pretty=展开缩进）'
        type: choice
        options:
          - compact
          - pretty
        default: compact
      gitee_token:
        description: 'Gitee 访问令牌（可选，留空则不同步到 Gitee Releases）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-subscription
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUTPUT_FORMAT: ${{ inputs.output_format }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 releases/lhj1618.json5 与 releases/version.json5
        run: |
          echo "输出格式：${OUTPUT_FORMAT}"
          cat > build.js <<'EOF'
          const fs   = require('fs');
          const path = require('path');

          const ROOT         = process.cwd();
          const APPS_DIR     = path.join(ROOT, 'apps');
          const OUT_DIR      = path.join(ROOT, 'releases');
          const SAMPLE       = path.join(ROOT, 'todo', 'sample.json5');
          const OUT_FILE     = path.join(OUT_DIR, 'lhj1618.json5');
          const VERSION_FILE = path.join(OUT_DIR, 'version.json5');
          const GLOBAL_FILE  = path.join(APPS_DIR, 'globalGroups-全局规则.md');
          const REPLACE_FLAG = '//替换标记';
          const GLOBAL_FLAG  = '//全局规则替换标记';
          const JSON5_PATH   = path.join(ROOT, 'todo', 'json5.js');
          const FORMAT       = (process.env.OUTPUT_FORMAT || 'compact').toLowerCase();

          function fail(msg) { console.error('❌ ' + msg); process.exit(1); }

          // 按选择格式化：compact=无缩进；pretty=2 空格缩进
          function stringify(o) {
            return FORMAT === 'pretty'
              ? JSON5.stringify(o, null, 2)
              : JSON5.stringify(o);
          }

          // ---------- 0. 加载本地 todo/json5.js ----------
          if (!fs.existsSync(JSON5_PATH)) fail(`找不到 ${JSON5_PATH}`);
          let JSON5;
          try { JSON5 = require(JSON5_PATH); } catch (e) { JSON5 = globalThis.JSON5; }
          if (!JSON5 && globalThis.JSON5) JSON5 = globalThis.JSON5;
          if (!JSON5 || typeof JSON5.parse !== 'function' || typeof JSON5.stringify !== 'function') {
            fail('todo/json5.js 未导出 parse/stringify，请确认是 json5 官方 dist 版本');
          }
          console.log('    ✅ 已加载 todo/json5.js');

          // ---------- 1. 前置校验 apps/*.md 的 JSON5 格式 ----------
          if (!fs.existsSync(APPS_DIR)) fail(`找不到目录 ${APPS_DIR}`);
          if (!fs.existsSync(SAMPLE))   fail(`找不到模板 ${SAMPLE}`);

          // 排除：readme*、globalGroups-全局规则.md（后者单独处理）
          const isExcluded = (f) => {
            const n = f.trim().toLowerCase();
            return /^readme/.test(n) || n === 'globalgroups-全局规则.md';
          };

          const mdFiles = fs.readdirSync(APPS_DIR)
                            .filter(f => f.endsWith('.md') && !isExcluded(f))
                            .sort();
          if (mdFiles.length === 0) {
            fail('apps 目录下没有可用的 .md 文件（已排除所有 readme* 和 globalGroups-全局规则.md）');
          }

          console.log('    开始校验 apps/*.md 的 JSON5 格式...');
          const badFiles = [];
          for (const f of mdFiles) {
            const full = path.join(APPS_DIR, f);
            const raw  = fs.readFileSync(full, 'utf8');
            const body = raw.split('```json5').join(''); // 忽略 ```json5 标记

            const attempts = [
              () => JSON5.parse('[' + body + ']'),
              () => JSON5.parse(body),
            ];
            let ok = false, lastErr = null;
            for (const t of attempts) {
              try { t(); ok = true; break; } catch (e) { lastErr = e; }
            }
            if (!ok) {
              badFiles.push({ file: f, msg: lastErr ? lastErr.message : '未知解析错误' });
              console.log(`      ❌ ${f}`);
            } else {
              console.log(`      ✓  ${f}`);
            }
          }

          if (badFiles.length) {
            console.error('');
            console.error('❌ 以下 md 文件存在 JSON5 格式错误，已中止：');
            for (const b of badFiles) {
              console.error(`   - apps/${b.file}`);
              console.error(`     原因：${b.msg}`);
            }
            process.exit(1);
          }
          console.log('    ✅ 全部 md 文件格式校验通过');

          // ---------- 1.5. 预读并校验 globalGroups-全局规则.md（若存在） ----------
          let globalBody = '';
          if (fs.existsSync(GLOBAL_FILE)) {
            const raw = fs.readFileSync(GLOBAL_FILE, 'utf8');
            globalBody = raw.split('```json5').join('');
            try {
              JSON5.parse('[' + globalBody + ']');
            } catch (e1) {
              try { JSON5.parse(globalBody); }
              catch (e2) { fail(`globalGroups-全局规则.md JSON5 格式错误：${e2.message}`); }
            }
            console.log('    ✅ globalGroups-全局规则.md 格式校验通过');
          } else {
            console.log('    ℹ️ 未发现 apps/globalGroups-全局规则.md');
          }

          // ---------- 2. 合并 apps/*.md（已排除 readme* 与 globalGroups-全局规则.md） ----------
          let combined = '\n';
          mdFiles.forEach((f, i) => {
            const text = fs.readFileSync(path.join(APPS_DIR, f), 'utf8');
            if (i > 0) combined += ',\n';
            combined += text;
            if (!text.endsWith('\n')) combined += '\n';
          });
          console.log('    ✅ 应用规则合并完成');

          // ---------- 3. 清理 ```json5 ----------
          const cleaned = combined.split('```json5').join('');
          console.log('    ✅ 多余内容清理完成');

          // ---------- 4. 替换标记（先全局规则，再主替换标记） ----------
          const src0 = fs.readFileSync(SAMPLE, 'utf8');
          if (!src0.includes(REPLACE_FLAG)) fail(`${SAMPLE} 中不存在替换标记 ${REPLACE_FLAG}`);

          let src = src0;
          if (src.includes(GLOBAL_FLAG)) {
            if (!fs.existsSync(GLOBAL_FILE)) {
              fail(`sample 中包含 ${GLOBAL_FLAG}，但找不到 ${GLOBAL_FILE}`);
            }
            src = src.split(GLOBAL_FLAG).join(globalBody);
            console.log('    ✅ 全局规则替换完成');
          } else {
            console.log('    ℹ️ sample 中未发现全局规则替换标记，跳过');
          }

          const finalText = src.split(REPLACE_FLAG).join(cleaned);
          console.log('    ✅ 替换标记内容完成');

          // ---------- 5. 解析 ----------
          let obj;
          try { obj = JSON5.parse(finalText); }
          catch (e) { fail('JSON5 解析失败：' + e.message); }

          // ---------- 6. 读取旧 version（lhj1618 优先，version.json5 兜底） ----------
          let oldVersion, oldSource = '';
          for (const f of [OUT_FILE, VERSION_FILE]) {
            if (!fs.existsSync(f)) continue;
            try {
              const o = JSON5.parse(fs.readFileSync(f, 'utf8'));
              if (o && o.version !== undefined) {
                oldVersion = o.version;
                oldSource  = path.relative(ROOT, f);
                break;
              }
            } catch (e) {
              console.warn(`   ⚠️ 读取 ${path.relative(ROOT, f)} 失败：${e.message}`);
            }
          }

          // ---------- 7. 计算新 version ----------
          let newVersion;
          if (oldVersion === undefined) {
            newVersion = obj.version;
            console.log(`   首次生成，version 保持模板值：${newVersion}`);
          } else if (typeof oldVersion === 'number') {
            newVersion = oldVersion + 1;
            console.log(`   version: ${oldVersion} → ${newVersion}  (源: ${oldSource})`);
          } else if (typeof oldVersion === 'string' && /^\d+$/.test(oldVersion)) {
            newVersion = String(parseInt(oldVersion, 10) + 1);
            console.log(`   version: ${oldVersion} → ${newVersion}  (源: ${oldSource})`);
          } else {
            newVersion = oldVersion;
            console.warn(`   ⚠️ version 类型不支持自动 +1，保持原值：${oldVersion}`);
          }

          // ---------- 8. 输出 lhj1618.json5 ----------
          obj.version = newVersion;
          fs.mkdirSync(OUT_DIR, { recursive: true });
          fs.writeFileSync(OUT_FILE, stringify(obj) + '\n', 'utf8');
          console.log(`    ✅ 已写入 releases/lhj1618.json5 (${FORMAT})`);


          // ---------- 9. 同步 id（与 sample.json5 内一致，不做变动）
          let vObj = {};

          if (obj.id !== undefined) {
            vObj.id = obj.id;
            console.log(`    ✅ 同步 id = ${obj.id}`);
          } else {
            console.log('    ℹ️ sample.json5 中未定义 id，version.json5 的 id 保持不变');
          }

          // 同步 version.json5（version + id） ----------
          if (fs.existsSync(VERSION_FILE)) {
            try {
              const parsed = JSON5.parse(fs.readFileSync(VERSION_FILE, 'utf8'));
              if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                vObj = parsed;
              }
            } catch (e) {
              console.warn('   ⚠️ 旧 version.json5 解析失败，将重建：' + e.message);
            }
          }
          vObj.version = newVersion;

          // 同步id和version完成 ----------

          fs.writeFileSync(VERSION_FILE, stringify(vObj) + '\n', 'utf8');
          console.log(`    ✅ 已同步 releases/version.json5 (${FORMAT})`);

          console.log('');
          console.log('✅ 整理订阅文件完成！');
          console.log('   releases/lhj1618.json5 version = ' + newVersion);
          console.log('   releases/version.json5 version = ' + newVersion);
          if (obj.id !== undefined) console.log('   id = ' + obj.id);
          console.log('   输出格式 = ' + FORMAT);
          EOF
          node build.js

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: lhj1618-json5
          path: |
            releases/lhj1618.json5
            releases/version.json5
          if-no-files-found: error

      - name: 提交结果回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/lhj1618.json5 releases/version.json5
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动生成 releases/*.json5 [${OUTPUT_FORMAT}][skip ci]"
            git push
          fi

      # ============ 新增：同步到 Gitee Releases ============
      - name: 同步到 Gitee Releases
        if: ${{ inputs.gitee_token != '' }}
        env:
          GITEE_TOKEN: ${{ inputs.gitee_token }}
          GITEE_OWNER: lhj1618
          GITEE_REPO: GGKD
        run: |
          set -euo pipefail
          echo "::add-mask::${GITEE_TOKEN}"

          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          # 读取 version.json5 中的 version 作为 tag
          VERSION=$(node -e '
            let JSON5;
            try { JSON5 = require("./todo/json5.js"); } catch (e) {}
            if (!JSON5 || typeof JSON5.parse !== "function") JSON5 = globalThis.JSON5;
            const o = JSON5.parse(require("fs").readFileSync("releases/version.json5","utf8"));
            process.stdout.write(String(o.version));
          ')
          TAG="v${VERSION}"
          echo "Gitee release tag: ${TAG}"

          extract_id() {
            node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const o=JSON.parse(d);process.stdout.write(String(o.id||""))}catch(e){process.stdout.write("")}})'
          }

          # 1) 查询是否已存在该 tag 的 release
          echo "查询是否已存在 release ${TAG} ..."
          RESP=$(curl -s -w "\n%{http_code}" \
            "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          RELEASE_ID=""
          if [ "$HTTP_CODE" = "200" ]; then
            RELEASE_ID=$(echo "$BODY" | extract_id)
          fi

          # 2) 不存在则创建（Gitee 会自动基于 target_commitish 创建 tag）
          if [ -z "$RELEASE_ID" ]; then
            echo "创建 release ${TAG} ..."
            BODY=$(curl -s -X POST "${API}/releases" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${TAG}" \
              -F "name=${TAG}" \
              -F "target_commitish=master" \
              -F "body=自动生成的订阅文件 ${TAG}")
            RELEASE_ID=$(echo "$BODY" | extract_id)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ 无法获取/创建 Gitee release"
            echo "$BODY"
            exit 1
          fi
          echo "Release ID: ${RELEASE_ID}"

          # 3) 现有附件清单（id name）
          ASSETS=$(echo "$BODY" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const o=JSON.parse(d);(o.assets||[]).forEach(a=>console.log(a.id+" "+a.name))}catch(e){}})' || true)

          # 4) 逐个文件：同名先删后传
          for FILE in releases/lhj1618.json5 releases/version.json5; do
            BASENAME=$(basename "$FILE")
            OLD_ID=$(echo "$ASSETS" | awk -v n="$BASENAME" '$2==n{print $1; exit}' || true)
            if [ -n "${OLD_ID:-}" ]; then
              echo "删除同名旧附件 ${BASENAME} (id=${OLD_ID})"
              curl -s -X DELETE \
                "${API}/releases/${RELEASE_ID}/attach_files/${OLD_ID}?access_token=${GITEE_TOKEN}" \
                >/dev/null || true
            fi

            echo "上传 ${FILE} ..."
            RESP=$(curl -s -w "\n%{http_code}" -X POST \
              "${API}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${FILE}")
            HTTP_CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            case "$HTTP_CODE" in
              2*) echo "  ✅ ${BASENAME} 上传成功" ;;
              *)
                echo "  ❌ ${BASENAME} 上传失败 (HTTP ${HTTP_CODE})"
                echo "$BODY"
                exit 1
                ;;
            esac
          done

          echo ""
          echo "✅ Gitee release 同步完成：https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${TAG}"