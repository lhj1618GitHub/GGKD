name: 创建订阅文件

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'todo/json5.js'
      - '.github/workflows/build-subscription.yml'
  pull_request:
    paths:
      - 'apps/**'

permissions:
  contents: write

concurrency:
  group: build-subscription
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 OK/lhj1618.json5
        run: |
          cat > build.js <<'EOF'
          const fs   = require('fs');
          const path = require('path');

          const ROOT         = process.cwd();
          const APPS_DIR     = path.join(ROOT, 'apps');
          const SAMPLE       = path.join(APPS_DIR, 'sample.json5');
          const OUT_DIR      = path.join(ROOT, 'OK');
          const OUT_FILE     = path.join(OUT_DIR, 'lhj1618.json5');
          const REPLACE_FLAG = '//替换标记';
          const JSON5_PATH   = path.join(ROOT, 'todo', 'json5.js');

          function fail(msg) { console.error('❌ ' + msg); process.exit(1); }

          // ---------- 0. 加载本地 todo/json5.js ----------
          if (!fs.existsSync(JSON5_PATH)) fail(`找不到 ${JSON5_PATH}`);
          let JSON5;
          try {
            JSON5 = require(JSON5_PATH);
          } catch (e) {
            // UMD 兜底：某些构建会挂到 globalThis
            JSON5 = globalThis.JSON5;
          }
          if (!JSON5 && globalThis.JSON5) JSON5 = globalThis.JSON5;
          if (!JSON5 || typeof JSON5.parse !== 'function' || typeof JSON5.stringify !== 'function') {
            fail('todo/json5.js 未导出 parse/stringify，请确认是 json5 官方 dist 版本');
          }
          console.log('    ✅ 已加载 todo/json5.js');

          // ---------- 1. 合并 apps/*.md（等价 to-one.bat） ----------
          if (!fs.existsSync(APPS_DIR)) fail(`找不到目录 ${APPS_DIR}`);
          if (!fs.existsSync(SAMPLE))   fail(`找不到模板 ${SAMPLE}`);

          const mdFiles = fs.readdirSync(APPS_DIR)
                            .filter(f => f.endsWith('.md'))
                            .sort();
          if (mdFiles.length === 0) fail('apps 目录下没有 .md 文件');

          let combined = '\n';
          mdFiles.forEach((f, i) => {
            const text = fs.readFileSync(path.join(APPS_DIR, f), 'utf8');
            if (i > 0) combined += ',\n';
            combined += text;
            if (!text.endsWith('\n')) combined += '\n';
            console.log('  + ' + f);
          });

          // ---------- 2. 清理 ```json5 ----------
          const cleaned = combined.split('```json5').join('');
          console.log('    ✅ 多余内容清理完成');

          // ---------- 3. 替换标记 ----------
          const src = fs.readFileSync(SAMPLE, 'utf8');
          if (!src.includes(REPLACE_FLAG)) fail(`${SAMPLE} 中不存在替换标记 ${REPLACE_FLAG}`);
          const finalText = src.split(REPLACE_FLAG).join(cleaned);
          console.log('    ✅ 替换标记内容完成');

          // ---------- 4. 解析、version+1 ----------
          let obj;
          try {
            obj = JSON5.parse(finalText);
          } catch (e) {
            fail('JSON5 解析失败：' + e.message);
          }

          if (fs.existsSync(OUT_FILE)) {
            try {
              const oldObj = JSON5.parse(fs.readFileSync(OUT_FILE, 'utf8'));
              const ov = oldObj.version;
              if (typeof ov === 'number') {
                obj.version = ov + 1;
                console.log(`   version: ${ov} → ${obj.version}`);
              } else if (typeof ov === 'string' && /^\d+$/.test(ov)) {
                obj.version = String(parseInt(ov, 10) + 1);
                console.log(`   version: ${ov} → ${obj.version}`);
              } else {
                console.warn(`   ⚠️ version 类型不支持自动 +1，保持原值: ${ov}`);
              }
            } catch (e) {
              console.warn('   ⚠️ 读取旧文件 version 失败：' + e.message);
            }
          } else {
            console.log(`   首次生成，version 保持模板值：${obj.version}`);
          }

          // ---------- 5. 使用 todo/json5.js 格式化 ----------
          const output = JSON5.stringify(obj, null, 2) + '\n';

          fs.mkdirSync(OUT_DIR, { recursive: true });
          fs.writeFileSync(OUT_FILE, output, 'utf8');

          console.log('');
          console.log('✅ 整理订阅文件完成！');
          console.log('   输出文件：' + path.relative(ROOT, OUT_FILE));
          EOF
          node build.js

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: lhj1618-json5
          path: OK/lhj1618.json5
          if-no-files-found: error

      - name: 提交结果回仓库
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OK/lhj1618.json5
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动生成 OK/lhj1618.json5 [skip ci]"
            git push
          fi