name: 创建订阅文件

on:
  workflow_dispatch:          # 支持手动触发
  push:
    branches: [ main ]
    paths:
      - 'apps/**'             # apps 目录内容变化时自动触发
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/**'

permissions:
  contents: write             # 允许把结果提交回仓库

concurrency:
  group: build-subscription
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============ 对应 to-one.bat：合并 apps/*.md → all-apps.ts ============
      - name: 合并 apps/*.md → all-apps.ts
        run: |
          python3 - <<'PY'
          import pathlib, sys

          root      = pathlib.Path.cwd()
          apps_dir  = root / "apps"
          ts_output = root / "all-apps.ts"

          if not apps_dir.is_dir():
              print(f"❌ 错误：找不到文件夹 {apps_dir}")
              sys.exit(1)

          md_files = sorted(apps_dir.glob("*.md"))
          if not md_files:
              print("❌ 错误：apps 目录下没有 .md 文件")
              sys.exit(1)

          parts = []
          for f in md_files:
              text = f.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")
              if text and not text.endswith("\n"):
                  text += "\n"
              parts.append(text)
              print(f"  + {f.name}")

          # 模拟 echo. 产生的首行空行 + 逗号分隔的各文件内容
          combined = ",\n".join(parts)
          with open(ts_output, "w", encoding="utf-8", newline="\n") as fh:
              fh.write(combined)

          print("")
          print("✅ 应用规则合并完成！")
          PY

      # ============ 对应 to-in.bat：清理 + 替换标记 ============
      - name: 生成 OK/lhj1618.json5
        run: |
          python3 - <<'PY'
          import pathlib, sys

          root          = pathlib.Path.cwd()
          ts_input      = root / "all-apps.ts"
          json5_source  = root / "apps" / "sample.json5"
          out_dir       = root / "OK"
          out_file      = out_dir / "lhj1618.json5"
          REPLACE_FLAG  = "//替换标记"

          # ---- 校验输入文件 ----
          if not ts_input.is_file():
              print(f"❌ 错误：未找到 {ts_input}")
              sys.exit(1)
          if not json5_source.is_file():
              print(f"❌ 错误：未找到 {json5_source}")
              sys.exit(1)

          # ---- 删除 all-apps.ts 中所有 ```json5 ----
          ts_text = ts_input.read_text(encoding="utf-8")
          cleaned = ts_text.replace("```json5", "")
          with open(ts_input, "w", encoding="utf-8", newline="\n") as fh:
              fh.write(cleaned)
          print("    ✅ 多余内容清理完成")

          # ---- 替换标记 ----
          src = json5_source.read_text(encoding="utf-8")
          if REPLACE_FLAG not in src:
              print(f"❌ {json5_source} 中不存在替换标记 {REPLACE_FLAG}")
              sys.exit(1)

          result = src.replace(REPLACE_FLAG, cleaned)

          out_dir.mkdir(parents=True, exist_ok=True)
          with open(out_file, "w", encoding="utf-8", newline="\n") as fh:
              fh.write(result)

          print("    ✅ 替换标记内容完成")
          print("")
          print("✅ 整理订阅文件完成！")
          print(f"    输出文件：{out_file.relative_to(root)}")
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: lhj1618-json5
          path: OK/lhj1618.json5
          if-no-files-found: error

      - name: 提交结果回仓库
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OK/lhj1618.json5
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动生成 OK/lhj1618.json5 [skip ci]"
            git push
          fi