<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件合并替换工具</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui,sans-serif}
        body{max-width:700px;margin:30px auto;padding:0 20px;background:#f7f9fa}
        .box{padding:15px 20px;border:1px solid #ddd;border-radius:10px;margin-bottom:15px;background:white}
        button{padding:12px 18px;background:#007bff;color:white;border:none;border-radius:8px;cursor:pointer;margin:5px}
        button:disabled{background:#ccc}
        .log{background:#f1f1f1;padding:12px;border-radius:8px;white-space:pre-wrap;height:260px;overflow-y:auto}
        h2{color:#222}
    </style>
</head>
<body>
    <h2>📂 本地文件合并 + 标记替换工具</h2>

    <div class="box">
        <button onclick="selectAppsFolder()">选择 apps 文件夹</button>
        <button onclick="selectJson5()">选择 sample.json5</button>
        <button onclick="startProcess()" id="startBtn" disabled>✅ 一键执行</button>
    </div>

    <div class="box log" id="log">日志：\n</div>

    <script>
        let appsFiles = [];
        let sampleJson5Content = "";
        const REPLACE_FLAG = "//替换标记";

        // 选择 apps 文件夹
        async function selectAppsFolder() {
            try {
                const folderHandle = await window.showDirectoryPicker();
                appsFiles = [];
                addLog("📂 已选择 apps 文件夹，遍历中...");

                for await (const entry of folderHandle.values()) {
                    if (entry.kind === "file") {
                        const file = await entry.getFile();
                        appsFiles.push({ name: file.name, file });
                    }
                }

                appsFiles.sort((a, b) => a.name.localeCompare(b.name));
                addLog(`✅ 加载完成：共 ${appsFiles.length} 个文件`);
                checkEnableStart();
            } catch (e) {
                addLog("❌ 选择文件夹失败：" + e.message);
            }
        }

        // 选择 sample.json5
        async function selectJson5() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json5";
            input.onchange = async e => {
                const file = e.target.files[0];
                if (!file) return;
                sampleJson5Content = await file.text();
                addLog("✅ 已加载 sample.json5");
                checkEnableStart();
            };
            input.click();
        }

        // 检查是否可以开始执行
        function checkEnableStart() {
            document.getElementById("startBtn").disabled = 
                appsFiles.length === 0 || !sampleJson5Content;
        }

        // 主流程：合并 → 清理 → 替换 → 下载
        async function startProcess() {
            addLog("\n🚀 开始执行...");

            // 1. 合并所有文件
            let allContent = "";
            for (const f of appsFiles) {
                const text = await f.file.text();
                allContent += text + "\n";
            }
            addLog("✅ 合并完成 → all-app.ts");

            // 2. 清理 ```
            allContent = allContent.replace(/```/g, "");
            addLog("✅ 清理 ``` 完成");

            // 3. 替换标记
            if (!sampleJson5Content.includes(REPLACE_FLAG)) {
                addLog("❌ 错误：未找到替换标记 " + REPLACE_FLAG);
                return;
            }
            const result = sampleJson5Content.replace(REPLACE_FLAG, allContent);
            addLog("✅ 替换完成");

            // 4. 下载文件
            download("all-app.ts", allContent);
            download("new.json5", result);

            addLog("\n🎉 全部完成！已自动下载 2 个文件：");
            addLog("   1. all-app.ts");
            addLog("   2. new.json5");
        }

        // 下载文件
        function download(filename, text) {
            const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 日志输出
        function addLog(text) {
            const el = document.getElementById("log");
            el.textContent += text + "\n";
            el.scrollTop = el.scrollHeight;
        }
    </script>
</body>
</html>
